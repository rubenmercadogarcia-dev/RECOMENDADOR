# Construye RECOMENDADOR.exe en Windows y lo publica en Releases.
#
# Para publicar una versión nueva, cambia el número del archivo VERSION
# (por ejemplo 0.5.0 → 0.6.0) y súbelo a main. También vale subir una
# etiqueta que empiece por "v". Lanzado a mano desde la pestaña Actions,
# solo construye el .exe, sin publicarlo.
name: Publicar versión (.exe)

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write                # para crear la release

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Construir RECOMENDADOR.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name RECOMENDADOR
          --add-data "ui;ui" --add-data "datos;datos"
          app.py

      - name: Comprobar que el .exe arranca
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\RECOMENDADOR.exe" -ArgumentList "--comprobar" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:TEMP\recomendador_comprobar.txt" -ErrorAction SilentlyContinue
            throw "El .exe no arranca bien (código $($p.ExitCode))"
          }
          "Tamaño: {0:N1} MB" -f ((Get-Item dist\RECOMENDADOR.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: RECOMENDADOR
          path: dist/RECOMENDADOR.exe

      - name: Publicar en Releases
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") { $tag = $env:GITHUB_REF_NAME }
          else { $tag = "v" + (Get-Content VERSION -Raw).Trim() }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "La versión $tag ya existe: sube el número del archivo VERSION." }
          gh release create $tag "dist/RECOMENDADOR.exe" --target $env:GITHUB_SHA `
            --title "RECOMENDADOR $tag" --notes-file ".github/notas_release.md"
